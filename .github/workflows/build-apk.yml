
name: Build SHERA RUN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shera-run-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build SHERA RUN APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4. Verify project
      - name: Verify project
        run: |
          set -e
          test -f package.json
          node --version
          npm --version
          java -version

      # 5. Install dependencies
      - name: Install game dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      # 6. Capacitor Core and Android
      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund \
            "@capacitor/core@^7" \
            "@capacitor/android@^7"

      # 7. Capacitor CLI
      - name: Install Capacitor CLI
        run: |
          npm install --save-dev --legacy-peer-deps \
            --no-audit --no-fund \
            "@capacitor/cli@^7"

      # 8. Verify Capacitor
      - name: Verify Capacitor
        run: |
          npx cap --version
          npm ls @capacitor/core @capacitor/android @capacitor/cli

      # 9. Configure game
      - name: Configure SHERA RUN
        shell: bash
        run: |
          set -e

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.js ]; then

            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sherarun.game",
            "appName": "SHERA RUN",
            "webDir": "dist"
          }
          EOF
          fi

      # 10. Build web game
      - name: Build web game
        run: |
          set -e
          npm run build
          test -f dist/index.html
          echo "Web game build successful"

      # 11. Setup Android SDK (FIXED)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      # 12. Install required SDK
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installed"

      # 13. Add Android platform
      - name: Add Android platform
        shell: bash
        run: |
          set -e

          if [ ! -d android ]; then
            npx cap add android
          fi

      # 14. Sync Capacitor
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # 15. Verify Android project
      - name: Verify Android project
        run: |
          set -e
          test -f android/gradlew
          echo "Android project ready"

      # 16. Build APK
      - name: Build SHERA RUN APK
        working-directory: android
        run: |
          set -e
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 17. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK not found!"
            find android -name "*.apk"
            exit 1
          fi

          echo "SHERA RUN APK SUCCESS!"
          ls -lh "$APK"

      # 18. Upload APK
      - name: Upload SHERA RUN APK
        uses: actions/upload-artifact@v4
        with:
          name: SHERA-RUN-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
